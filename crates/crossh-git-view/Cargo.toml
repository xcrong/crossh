[package]
name = "crossh-git-view"
version = "0.48.0"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
visual-tests = []

[dependencies]
crossh-core = { path = "../crossh-core" }
crossh-editor = { path = "../crossh-editor" }
crossh-ui = { path = "../crossh-ui" }
crossh-ui-component = { path = "../crossh-ui-component" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "2664a0aa1eae5dabf8f8273c03f88d53061ca7dc" }
log = "0.4"
rust-i18n = "4"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "2664a0aa1eae5dabf8f8273c03f88d53061ca7dc", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2664a0aa1eae5dabf8f8273c03f88d53061ca7dc", features = ["font-kit", "test-support", "wayland", "x11"] }

[lints]
workspace = true
