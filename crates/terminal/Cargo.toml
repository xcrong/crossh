[package]
name = "terminal"
version = "0.31.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
test-support = []

[lib]
path = "src/terminal.rs"
doctest = false

[dependencies]
async-channel = "2.5.0"
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
anyhow = "1.0.86"
collections = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
crossh-terminal = { path = "../crossh-terminal" }
futures = "0.3.32"
futures-lite = "1.13"
gpui = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
itertools = "0.14.0"
libc = "0.2"
log = "0.4.16"
regex = "1.5"
release_channel = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.37.0"
task = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
theme = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
thiserror = "2.0.12"
url = "2.2"
util = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
urlencoding = "2.1.2"
vte = { version = "0.15.0", features = ["ansi"] }
parking_lot = "0.12.1"
percent-encoding = "2.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8", features = ["test-support"] }
rand = "0.8"
util_macros = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
