[package]
name = "terminal"
version = "0.36.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[features]
test-support = []

[lib]
path = "src/terminal.rs"
doctest = false

[dependencies]
async-channel = "2.5.0"
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
anyhow = "1.0.86"
collections = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
crossh-terminal = { path = "../crossh-terminal" }
futures = "0.3.32"
futures-lite = "2"
gpui = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
itertools = "0.15"
libc = "0.2"
log = "0.4.16"
regex = "1.5"
release_channel = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.39"
task = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
theme = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
thiserror = "2.0.12"
url = "2.2"
util = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
urlencoding = "2.1.2"
vte = { version = "0.15.0", features = ["ansi"] }
parking_lot = "0.12.1"
percent-encoding = "2.3.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece", features = ["test-support"] }
rand = "0.10"
util_macros = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
