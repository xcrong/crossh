[package]
name = "crossh-update"
version = "0.38.1"
edition = "2024"
license = "GPL-3.0-or-later"

[features]
# Default keeps release behavior. The network feature pulls
# reqwest/rustls/aws-lc (~80s cold); the dev loop builds without it.
default = ["network"]
network = ["dep:reqwest"]

[dependencies]
base64 = "0.23"
dirs = "6"
ed25519-dalek = "3"
flate2 = "1"
getrandom = "0.4"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
url = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
