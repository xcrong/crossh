[package]
name = "crossh-agent"
version = "0.10.2"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
libc = "0.2"
regex = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
