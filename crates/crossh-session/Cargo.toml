[package]
name = "crossh-session"
version = "0.46.2"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "crossh-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "6"
dunce = "1"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
crossh-core = { path = "../crossh-core" }
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# 中严重#4：集成测试并行改全局 env 竞态，用跨进程文件锁统一串行改 env 的用例。
serial_test = { version = "3", features = ["file_locks"] }

[lints]
workspace = true
