[package]
name = "crossh-session"
version = "0.43.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "crossh-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
crossh-core = { path = "../crossh-core" }
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
