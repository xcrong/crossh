[package]
name = "crossh-terminal-view"
version = "0.35.1"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
crossh-core = { path = "../crossh-core" }
crossh-terminal = { path = "../crossh-terminal" }
crossh-ui = { path = "../crossh-ui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
itertools = "0.15"
log = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
shlex = "2"
task = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
terminal = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
theme = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }
unicode-width = "0.2"
util = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece", features = ["font-kit", "test-support", "wayland", "x11"] }