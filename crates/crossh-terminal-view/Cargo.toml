[package]
name = "crossh-terminal-view"
version = "0.36.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
crossh-core = { path = "../crossh-core" }
crossh-terminal = { path = "../crossh-terminal" }
crossh-ui = { path = "../crossh-ui" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
itertools = "0.15"
log = "0.4"
schemars = "1"
serde = { version = "1", features = ["derive"] }
shlex = "2"
task = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
terminal = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
theme = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }
unicode-width = "0.2"
util = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", features = ["font-kit", "test-support", "wayland", "x11"] }
