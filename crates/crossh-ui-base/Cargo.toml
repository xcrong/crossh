[package]
name = "crossh-ui-base"
version = "0.34.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Unstyled behavior and geometry foundation for Crossh GPUI components (no theme, no app state)"
repository = "https://github.com/crossh/crossh"
keywords = ["gpui", "ui", "accessibility"]
categories = ["gui"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "251854020a9dbea1a388bf392c9bd04fd136a557" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "251854020a9dbea1a388bf392c9bd04fd136a557", features = ["test-support"] }

[lints.rust]
missing_docs = "warn"
