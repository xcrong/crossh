[package]
name = "crossh-ui-base"
version = "0.32.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Unstyled behavior and geometry foundation for Crossh GPUI components (no theme, no app state)"
repository = "https://github.com/crossh/crossh"
keywords = ["gpui", "ui", "accessibility"]
categories = ["gui"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1057c2cf3d5b4aefd04755e1387c7826a4d7fba6" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1057c2cf3d5b4aefd04755e1387c7826a4d7fba6", features = ["test-support"] }

[lints.rust]
missing_docs = "warn"
