[package]
name = "crossh-ui-base"
version = "0.35.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Unstyled behavior and geometry foundation for Crossh GPUI components (no theme, no app state)"
repository = "https://github.com/crossh/crossh"
keywords = ["gpui", "ui", "accessibility"]
categories = ["gui"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "74646bf29c1a3d1cdb178930d810ecc5a8a6bece", features = ["test-support"] }

[lints.rust]
missing_docs = "warn"
