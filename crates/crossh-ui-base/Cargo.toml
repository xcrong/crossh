[package]
name = "crossh-ui-base"
version = "0.47.2"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Unstyled behavior and geometry foundation for Crossh GPUI components (no theme, no app state)"
repository = "https://github.com/crossh/crossh"
keywords = ["gpui", "ui", "accessibility"]
categories = ["gui"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "2664a0aa1eae5dabf8f8273c03f88d53061ca7dc" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "2664a0aa1eae5dabf8f8273c03f88d53061ca7dc", features = ["test-support"] }

[lints]
workspace = true
