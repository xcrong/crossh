[package]
name = "crossh-ui-base"
version = "0.44.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Unstyled behavior and geometry foundation for Crossh GPUI components (no theme, no app state)"
repository = "https://github.com/crossh/crossh"
keywords = ["gpui", "ui", "accessibility"]
categories = ["gui"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1478fb5e60f8b7852a2b0da32aa3da5cd9bb6954" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1478fb5e60f8b7852a2b0da32aa3da5cd9bb6954", features = ["test-support"] }

[lints.rust]
missing_docs = "warn"
