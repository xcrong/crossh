[package]
name = "crossh-core"
version = "0.44.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
base64 = "0.23"
shlex = "2"
dirs = "6"
dunce = "1"
env_logger = "0.11"
log = "0.4"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
schemars = "1"
unicode-width = "0.2"
sysinfo = "0.39"
sys-locale = "0.3"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
