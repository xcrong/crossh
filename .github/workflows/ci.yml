name: CI

on:
  push:
    branches: [main]
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  check:
    name: fmt / clippy / test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Architecture checks
        run: scripts/check-architecture.sh

      - name: Verify Cargo.lock is synchronized
        shell: bash
        run: |
          cargo metadata --format-version 1 --no-deps --locked >/dev/null
          git diff --exit-code -- Cargo.lock

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --release --workspace

  terminal-compat:
    name: terminal replay / platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake nasm pkg-config \
            libfontconfig1-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libxcb1-dev libxcb-composite0-dev libxcb-dri3-dev libxcb-icccm4-dev \
            libxcb-keysyms1-dev libxcb-present-dev libxcb-render-util0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xinput-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --release --workspace

      - name: Run terminal replay tests
        run: cargo test --release --test terminal_replay -- --test-threads=1
