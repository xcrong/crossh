name: Release

# 打 tag（v*）时自动构建并发布 macOS .app 包。
# 本地等价命令:  scripts/package.sh

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build & package crossh.app
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build & package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/package.sh "$VERSION"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossh-macos
          path: dist/crossh.app
          if-no-files-found: error

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossh-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Generate release notes
        id: notes
        run: |
          PREV="$(git tag --sort=-v:refname | sed -n '2p' || true)"
          if [ -n "$PREV" ]; then
            {
              echo "## What's Changed"
              git log --oneline --no-merges "$PREV"..HEAD | sed 's/^/- /'
              echo ""
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...${GITHUB_REF_NAME}"
            } > RELEASE_NOTES.md
          else
            git log --oneline --no-merges | sed 's/^/- /' > RELEASE_NOTES.md
          fi

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: RELEASE_NOTES.md
