name: Release

# 打 tag（v*）时自动构建并发布三平台、多架构产物：
#   macOS:  aarch64 / x86_64 未签名 .app zip（暂不需要 Developer ID）
#   Linux:  x86_64 / aarch64 tar.gz + AppImage
#   Windows: x86_64 zip（aarch64 实验性，编译失败不阻塞发布）
# 本地等价命令:  scripts/package.sh / package-linux.sh / package-windows.ps1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: macos-latest
    # 仅保留发布专属校验（tag 版本与 Cargo.toml 一致性）。fmt /
    # check-architecture / clippy / 全量测试 / Cargo.lock 同步等通用门禁由
    # ci.yml 的 check job 在 main push 与 PR 上执行，tag 均从已验证的 main
    # 提交打出，这里刻意不重复执行，避免发布时重复消耗 macOS runner 时间。
    steps:
      - uses: actions/checkout@v4

      - name: Verify release metadata
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            for manifest in Cargo.toml crates/*/Cargo.toml; do
              manifest_version="$(bash scripts/package-version.sh "$manifest")"
              test "$manifest_version" = "$tag_version" || {
                echo "$manifest has version $manifest_version; expected $tag_version" >&2
                exit 1
              }
            done
          fi

  build:
    name: ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue_on_error || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS aarch64
            os: macos-15
            target: aarch64-apple-darwin
            package: bash scripts/package.sh aarch64-apple-darwin "$VERSION"
            artifact: crossh-macos-aarch64
            glob: dist/*macos.zip

          - name: macOS x86_64
            os: macos-15
            target: x86_64-apple-darwin
            package: bash scripts/package.sh x86_64-apple-darwin "$VERSION"
            artifact: crossh-macos-x86_64
            glob: dist/*macos.zip

          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            setup: |
              sudo apt-get update
              sudo apt-get install -y build-essential cmake pkg-config \
                libxcb1-dev libxcb-composite0-dev libxcb-dri3-dev libxcb-icccm4-dev \
                libxcb-keysyms1-dev libxcb-present-dev libxcb-render-util0-dev \
                libxcb-render0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
                libxcb-xkb-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xinput-dev \
                libxkbcommon-dev libfontconfig1-dev libwayland-dev wayland-protocols \
                librsvg2-bin
            package: bash scripts/package-linux.sh x86_64-unknown-linux-gnu "$VERSION"
            artifact: crossh-linux-x86_64
            glob: |
              dist/*linux-x86_64.tar.gz
              dist/*linux-x86_64.AppImage

          - name: Linux aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            setup: |
              sudo apt-get update
              sudo apt-get install -y build-essential cmake pkg-config \
                libxcb1-dev libxcb-composite0-dev libxcb-dri3-dev libxcb-icccm4-dev \
                libxcb-keysyms1-dev libxcb-present-dev libxcb-render-util0-dev \
                libxcb-render0-dev libxcb-shape0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
                libxcb-xkb-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xinput-dev \
                libxkbcommon-dev libfontconfig1-dev libwayland-dev wayland-protocols \
                librsvg2-bin
            package: bash scripts/package-linux.sh aarch64-unknown-linux-gnu "$VERSION"
            artifact: crossh-linux-aarch64
            glob: |
              dist/*linux-aarch64.tar.gz
              dist/*linux-aarch64.AppImage

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            package: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -Target x86_64-pc-windows-msvc -Version "$VERSION"
            artifact: crossh-windows-x86_64
            glob: dist/*windows-x86_64.zip

          - name: Windows aarch64 (experimental)
            os: windows-latest
            target: aarch64-pc-windows-msvc
            continue_on_error: true
            package: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-windows.ps1 -Target aarch64-pc-windows-msvc -Version "$VERSION"
            artifact: crossh-windows-aarch64
            glob: dist/*windows-aarch64.zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(bash scripts/package-version.sh)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: matrix.setup != ''
        shell: bash
        run: ${{ matrix.setup }}

      - name: Build & package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.value }}
        run: ${{ matrix.package }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crossh-*
          path: dist
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          PREV="$(git tag --sort=-v:refname | sed -n '2p' || true)"
          if [ -n "$PREV" ]; then
            {
              echo "## What's Changed"
              git log --oneline --no-merges "$PREV"..HEAD | sed 's/^/- /'
              echo ""
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...${GITHUB_REF_NAME}"
            } > RELEASE_NOTES.md
          else
            git log --oneline --no-merges | sed 's/^/- /' > RELEASE_NOTES.md
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * | tee sha256sums.txt

      - name: Generate update manifest
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/generate-update-manifest.sh "${VERSION#v}" "$GITHUB_REPOSITORY"

      # Ed25519 签名：私钥只存在于 GitHub Secrets，经环境变量注入；
      # 自验使用与客户端完全相同的固定公钥，签名或自验失败即中止发布，
      # 绝不产出未签名 manifest（fail-closed，见 docs/adr/0014-update-manifest-signature.md）。
      - name: Sign update manifest
        env:
          CROSSH_UPDATE_SIGNING_KEY: ${{ secrets.CROSSH_UPDATE_SIGNING_KEY }}
        run: cargo run --quiet --package crossh-update --bin crossh-sign-manifest -- sign dist/stable.json

      - name: Verify update manifest signature
        run: cargo run --quiet --package crossh-update --bin crossh-sign-manifest -- verify dist/stable.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
            dist/sha256sums.txt
            dist/stable.json
          body_path: RELEASE_NOTES.md
