[package]
name = "crossh"
version = "0.9.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
assets = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
flate2 = "1"
hex = "0.4"
gpui = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3", features = ["font-kit"] }
itertools = "0.14"
terminal = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
settings = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
task = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
theme = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
theme_settings = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
util = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
libc = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
release_channel = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
russh = "0.62"
russh-sftp = "2.3"
semver = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
async-channel = "2"
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs = "6"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
toml = "0.8"
url = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "1"

[profile.dev.package."*"]
opt-level = "z"

# Keep the shipped binary close to the size profile used by Zed itself.
# `strip` removes linker symbols from the distributable while LTO lets LLVM
# discard code that is only reachable through the large Zed dependency graph.
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "abort"
incremental = false

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
