[package]
name = "crossh"
version = "0.15.0"
edition = "2024"
license = "GPL-3.0-or-later"
default-run = "crossh"

[features]
visual-tests = []

[workspace]
members = [
    ".",
    "crates/crossh-core",
    "crates/crossh-agent",
    "crates/crossh-ai-sdk",
    "crates/crossh-assets",
    "crates/crossh-theme",
    "crates/crossh-ssh",
    "crates/crossh-terminal",
    "crates/crossh-update",
    "crates/crossh-ui",
    "crates/crossh-ui-component",
]
resolver = "2"

[dependencies]
assets = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
crossh-core = { path = "crates/crossh-core" }
crossh-agent = { path = "crates/crossh-agent" }
crossh-theme = { path = "crates/crossh-theme" }
crossh-ssh = { path = "crates/crossh-ssh" }
crossh-terminal = { path = "crates/crossh-terminal" }
crossh-update = { path = "crates/crossh-update" }
crossh-ui = { path = "crates/crossh-ui" }
crossh-ui-component = { path = "crates/crossh-ui-component" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3", features = ["font-kit"] }
itertools = "0.14"
terminal = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
settings = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
task = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
theme = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
theme_settings = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
util = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
release_channel = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3" }
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
async-channel = "2"
log = "0.4"
env_logger = "0.11"
dirs = "6"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
toml = "0.8"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-width = "0.2"
shlex = "1"
schemars = "1"
tui-markdown = { version = "0.3.8", default-features = false }

[dev-dependencies]
pretty_assertions = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "90d024b88abc91264d9a0ad260eb4f365fa695c3", features = ["font-kit", "test-support"] }

[[test]]
name = "visual_capture"
path = "tests/visual_capture.rs"
harness = false
required-features = ["visual-tests"]

[profile.dev.package."*"]
opt-level = "z"

# Keep the shipped binary close to the size profile used by Zed itself.
# `strip` removes linker symbols from the distributable while LTO lets LLVM
# discard code that is only reachable through the large Zed dependency graph.
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "abort"
incremental = false

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
