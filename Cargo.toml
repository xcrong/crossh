[package]
name = "crossh"
version = "0.28.0"
edition = "2024"
license = "GPL-3.0-or-later"
default-run = "crossh"

[features]
default = ["wayland", "x11"]
visual-tests = []
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]

[workspace]
members = [
    ".",
    "crates/crossh-core",
    "crates/crossh-assets",
    "crates/crossh-theme",
    "crates/crossh-terminal",
    "crates/crossh-update",
    "crates/crossh-ui",
    "crates/crossh-ui-component",
    "crates/crossh-note",
]
resolver = "2"

[dependencies]
crossh-core = { path = "crates/crossh-core" }
crossh-note = { path = "crates/crossh-note" }
crossh-theme = { path = "crates/crossh-theme" }
crossh-terminal = { path = "crates/crossh-terminal" }
crossh-update = { path = "crates/crossh-update" }
crossh-ui = { path = "crates/crossh-ui" }
crossh-ui-component = { path = "crates/crossh-ui-component" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8", features = ["font-kit", "wayland", "x11"] }
itertools = "0.14"
terminal = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
settings = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
task = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
theme = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
theme_settings = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
util = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
release_channel = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
semver = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
async-channel = "2"
log = "0.4"
env_logger = "0.11"
dirs = "6"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
toml = "0.8"
shlex = "1"
schemars = "1"
unicode-width = "0.2"
pulldown-cmark = "0.10"
parking_lot = "0.12"

[dev-dependencies]
assets = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8", features = ["font-kit", "test-support", "wayland", "x11"] }

[profile.dev]
incremental = true
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = "z"

# Keep the shipped binary close to the size profile used by Zed itself.
# `strip` removes linker symbols from the distributable while LTO lets LLVM
# discard code that is only reachable through the large Zed dependency graph.
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "abort"
incremental = false

[patch.crates-io]
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
async-process = { git = "https://github.com/zed-industries/async-process", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
