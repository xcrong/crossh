[package]
name = "crossh"
version = "0.47.0"
edition = "2024"
license = "GPL-3.0-or-later"
default-run = "crossh"

[features]
default = ["wayland", "x11", "updates-network"]
visual-tests = []
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]
# Release behavior. The dev loop builds without it to skip reqwest/rustls/aws-lc (~80s cold):
# cargo check --no-default-features --features wayland,x11
updates-network = ["crossh-update/network"]

[workspace]
members = [
    ".",
    "crates/crossh-core",
    "crates/crossh-assets",
    "crates/crossh-note-view",
    "crates/crossh-git-view",
    "crates/crossh-terminal",
    "crates/crossh-terminal-view",
    "crates/crossh-update",
    "crates/crossh-ui",
    "crates/crossh-ui-base",
    "crates/crossh-ui-component",
    "crates/crossh-note",
    "crates/crossh-editor",
    "crates/terminal",
    "crates/crossh-session",
]
resolver = "2"

# Shared lint baseline inherited by every member through `[lints] workspace = true`.
# Keep this table conservative: CI runs `cargo clippy -- -D warnings`, so every
# entry here is enforced across the whole workspace. Stricter per-crate rules stay
# in the crate that can satisfy them (e.g. `missing_docs` in crossh-ui-base).
[workspace.lints.rust]
# Edition 2024 already warns; stated explicitly so the baseline is visible.
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# Keep the default warning groups explicit instead of relying on tool defaults.
all = { level = "warn", priority = -1 }
# `all` is warn-only; correctness findings stay hard errors.
correctness = { level = "deny", priority = 1 }
# Never commit debugging or unfinished-code macros.
dbg_macro = "deny"
todo = "deny"

[dependencies]
crossh-core = { path = "crates/crossh-core" }
crossh-note = { path = "crates/crossh-note" }
crossh-note-view = { path = "crates/crossh-note-view" }
crossh-git-view = { path = "crates/crossh-git-view" }
crossh-terminal = { path = "crates/crossh-terminal" }
crossh-terminal-view = { path = "crates/crossh-terminal-view" }
crossh-update = { path = "crates/crossh-update", default-features = false }
crossh-ui = { path = "crates/crossh-ui" }
crossh-ui-component = { path = "crates/crossh-ui-component" }
crossh-editor = { path = "crates/crossh-editor" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "2664a0aa1eae5dabf8f8273c03f88d53061ca7dc" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2664a0aa1eae5dabf8f8273c03f88d53061ca7dc", features = ["font-kit", "wayland", "x11"] }
crossh-session = { path = "crates/crossh-session" }
itertools = "0.15"
semver = "1"
terminal = { path = "crates/terminal" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
log = "0.4"
dirs = "6"
dunce = "1"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3"
toml = "1"
shlex = "2"
schemars = "1"
unicode-width = "0.2"

 # 菜单栏 tray（仅 macOS；Linux 不引 GTK/AppIndicator，Windows 后续跟进）。
 [target.'cfg(target_os = "macos")'.dependencies]
 tray-icon = "0.26"

 # 链接预览的原生 WebView（macOS / Windows；Linux 不引 GTK/WebKitGTK，回退系统浏览器）。
 [target.'cfg(any(target_os = "macos", windows))'.dependencies]
 wry = { version = "0.57", default-features = false }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "2664a0aa1eae5dabf8f8273c03f88d53061ca7dc", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2664a0aa1eae5dabf8f8273c03f88d53061ca7dc", features = ["font-kit", "test-support", "wayland", "x11"] }
terminal = { path = "crates/terminal" }
async-channel = "2"

[lints]
workspace = true

[profile.dev]
incremental = true
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = "z"

# Keep the shipped binary close to the size profile used by Zed itself.
# `strip` removes linker symbols from the distributable while LTO lets LLVM
# discard code that is only reachable through the large Zed dependency graph.
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = "symbols"
panic = "abort"
incremental = false

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
